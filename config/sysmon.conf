# sysmon configuration  (installed to /etc/sysmon/sysmon.conf)
# Reload a running daemon after editing:  sudo systemctl reload sysmon   (sends SIGHUP)

[general]
interval      = 60                              # seconds between checks (daemon)
report_dir    = /var/log/sysmon/reports
state_dir     = /var/lib/sysmon
log_file      = /var/log/sysmon/sysmon.log
history_limit = 1440                            # samples kept (1 day at 60s)
keep_reports  = 100                             # timestamped reports kept

[thresholds]
cpu_warn   = 75
cpu_crit   = 90
mem_warn   = 80
mem_crit   = 92
swap_warn  = 50
swap_crit  = 80
disk_warn  = 80
disk_crit  = 90
inode_warn = 80
inode_crit = 90
load_warn  = 1.0                                # 1-minute load PER CORE
load_crit  = 2.0
zombie_warn = 5

[services]
# "a|b" = aliases; the first one systemd knows is used (ssh on Debian/Ubuntu, sshd on RHEL)
watch        = ssh|sshd, cron|crond, rsyslog
auto_restart = yes

[network]
# Ports that may listen on ALL interfaces. Anything else raises a WARNING.
# Leave empty to disable the check.
allowed_ports = 22

[processes]
top_n = 5

[actions]
enabled          = yes
dry_run          = yes                          # yes = only LOG what would be done. Set to "no" to go live.
restart_cooldown = 300                          # seconds before the same service may be restarted again
cleanup_paths    = /tmp, /var/tmp
cleanup_days     = 7
cleanup_cooldown = 3600
